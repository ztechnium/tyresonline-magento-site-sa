# CORS for Magento static assets when loaded from cdn.tyresonline.sa
# Required for XHR/fetch: js-translation.json, Knockout .html templates, etc.
<IfModule mod_headers.c>
    <LocationMatch "^/static/">
        SetEnvIf Origin "^https://(.*\.)?tyresonline\.sa$" CORS_ORIGIN=$0
        Header always set Access-Control-Allow-Origin "%{CORS_ORIGIN}e" env=CORS_ORIGIN
        Header always set Access-Control-Allow-Methods "GET, HEAD, OPTIONS" env=CORS_ORIGIN
        Header always set Access-Control-Allow-Headers "Origin, Accept, Content-Type, X-Requested-With" env=CORS_ORIGIN
        Header always set Access-Control-Max-Age "86400" env=CORS_ORIGIN
        Header always append Vary "Origin" env=CORS_ORIGIN
    </LocationMatch>
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteCond %{REQUEST_URI} ^/static/
    RewriteRule ^ - [R=204,L]
</IfModule>
